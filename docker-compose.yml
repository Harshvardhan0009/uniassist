services:
  chroma:
    image: chromadb/chroma:latest
    container_name: uniassist-chroma
    ports:
      - "8001:8000"
    volumes:
      - ./backend/chroma_db:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
